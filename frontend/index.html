      <h1>Prodea — El prode del Mundial 2026 con tus amigos</h1>
      <p>Predecí los resultados de cada partido del Mundial, ganá motes como "El Crack" o "El Mufa" y compartí tu carta tipo figurita con el grupo. Gratis, sin vueltas.</p>
      <h2>Cómo funciona</h2>
      <ul>
        <li>Armá tu torneo o sumate con un código de invitación</li>
        <li>Cargá tu predicción antes de que arranque cada partido</li>
        <li>Sumá puntos: 3 por resultado exacto, 1 por acertar el ganador</li>
        <li>Recibí tu mote de la fecha y compartilo en WhatsApp o Instagram</li>
      </ul>
      <h2>Motes por fecha</h2>
      <ul>
        <li>El Crack — mayor puntaje de la fecha</li>
        <li>El Mufa — menor puntaje de la fecha</li>
        <li>El Adivino — acertó 3 o más resultados exactos</li>
        <li>El Francotirador — acertó al menos 1 resultado exacto</li>
        <li>El Payaso — no acertó ningún ganador</li>
        <li>El Dormido — no cargó ninguna predicción</li>
      </ul>
      <p><a href="/register">Crear mi torneo gratis</a> · <a href="/login">Iniciar sesión</a> · <a href="/privacidad">Política de privacidad</a></p>
    </noscript>
    <script>
      // Si el script principal falla (deploy nuevo: el archivo viejo ya no existe
      // y el server devuelve index.html en su lugar), recargamos una vez para
      // traer la versión actual de la app.
      window.addEventListener('error', function (e) {
        if (e.target && e.target.tagName === 'SCRIPT' && !sessionStorage.getItem('prodea-reload-once')) {
          sessionStorage.setItem('prodea-reload-once', '1')
          window.location.reload()
        }

    </script>
